<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexGen Studio — Sign in</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B0B0F;color:#fff;font:16px -apple-system,BlinkMacSystemFont,sans-serif}
  .card{background:#16161C;border:1px solid #2A2A33;border-radius:16px;padding:32px 28px;width:min(92vw,360px);box-sizing:border-box;text-align:center}
  h1{font-size:22px;margin:0 0 6px}.sub{color:#9a9aad;font-size:14px;margin:0 0 22px}
  input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1px solid #3A3A46;background:#0B0B0F;color:#fff;font-size:16px;margin-bottom:12px}
  button{width:100%;padding:12px;border:0;border-radius:10px;background:#E81830;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  .err{display:none;color:#FF6B6B;font-size:14px;margin-bottom:12px}
</style></head><body>
<div class="card">
  <h1>NexGen Studio</h1>
  <p class="sub">Private workspace — enter the studio password.</p>
  <p class="err" id="err">Wrong password. Try again.</p>
  <form method="POST" action="/api/login">
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
    <button type="submit">Open studio</button>
  </form>
</div>
<script>
  if (new URLSearchParams(location.search).get('error')) document.getElementById('err').style.display = 'block';
</script>
</body></html>
